<style>
/* ---------- Theme tokens ---------------------------------------------------
   macOS Sequoia visual language, in two calm palettes. Component CSS reads
   only these variables, so dark and light stay identical in structure and
   differ solely in the values below. */
:root {
  /* Dark Mode */
  --bg:         #2A2F2F;   /* app background */
  --pane-bg:    #151515;   /* cards: toolbar, pane bars, menus */
  --editor-bg:  #171717;   /* editor surface (recessed under the card) */
  --editor-text: #D8D8DA;  /* editor body copy — dimmer than --text: near-black-on-near-white
                               reads fine at full contrast, but full-white-on-full-black text
                               optically "blooms" and looks heavier than it is, so the writing
                               surface gets its own, softer foreground (~12.6:1, still well
                               past AA) instead of reusing --text (~16.4:1). */
  --border:     #2A2A2A;   /* all 1px borders / separators */
  --text:       #ECECEC;   /* primary */
  --text-dim:   #A0A3A3;   /* secondary / spec text */
  --text-faint: #7E8181;   /* tertiary (menu group headers) */

  --btn-bg:     #353535;   /* primary control fill */
  --btn-hover:  #3f3f3f;
  --btn-border: rgba(255,255,255,.08);
  --btn-shadow: none;

  --track-bg:       #0F0F0F;            /* segmented-toggle track */
  --chip-text:      #A0A3A3;
  --chip-hover:     rgba(255,255,255,.05);
  --chip-on-bg:     #57605F;            /* toggle chip when ON */
  --chip-on-text:   #DFE0E0;
  --chip-on-shadow: none;

  --btn-on-bg:   #57605F;               /* primary button in an active state */
  --btn-on-text: #DFE0E0;

  --menu-item-bg: #333838;
  --menu-shadow:  0 12px 30px rgba(0,0,0,.5);

  --range-accent: #8A8D8D;
  --sel:        rgba(138,141,141,.30);
  --focus:      #8A8D8D;
  --pane-focus: #57605F;
  --ok:         #8FB39A;

  --diff-a:      rgba(214,124,124,.16);  /* line only in the left pane  */
  --diff-b:      rgba(126,178,134,.16);  /* line only in the right pane */
  --diff-a-word: rgba(214,124,124,.34);
  --diff-b-word: rgba(126,178,134,.34);

  --link:       #7FB3D9;               /* preview links — calm blue, quiet on dark */
  --code-bg:    #262626;               /* preview inline code + code blocks */
  --mono-stack: ui-monospace, Menlo, Consolas, monospace;
}

/* Light theme — same macOS Sequoia language, System Settings light palette.
   Activated by data-theme="light" on the root. */
:root[data-theme="light"] {
  --bg:         #E9E9EB;   /* window grey */
  --pane-bg:    #F6F6F7;   /* cards */
  --editor-bg:  #FFFFFF;   /* bright writing surface */
  --editor-text: #1D1D1F;  /* dark-on-light doesn't get the halation problem light-on-dark
                               does, so this just mirrors --text — no visual change here */
  --border:     #D9D9DD;
  --text:       #1D1D1F;
  --text-dim:   #86868B;
  --text-faint: #A1A1A6;

  --btn-bg:     #FFFFFF;                 /* native raised light control */
  --btn-hover:  #F0F0F2;
  --btn-border: rgba(0,0,0,.12);
  --btn-shadow: 0 1px 1.5px rgba(0,0,0,.10);

  --track-bg:       #E6E6E8;
  --chip-text:      #6E6E73;
  --chip-hover:     rgba(0,0,0,.05);
  --chip-on-bg:     #FFFFFF;             /* selected segment: white, raised */
  --chip-on-text:   #1D1D1F;
  --chip-on-shadow: 0 1px 1.5px rgba(0,0,0,.12);

  --btn-on-bg:   #E2E2E6;
  --btn-on-text: #1D1D1F;

  --menu-item-bg: #FFFFFF;
  --menu-shadow:  0 12px 30px rgba(0,0,0,.18);

  --range-accent: #8E8E93;
  --sel:        rgba(0,0,0,.12);
  --focus:      #8E8E93;
  --pane-focus: #C7C7CC;
  --ok:         #3F9E52;

  --diff-a:      rgba(198,86,86,.14);
  --diff-b:      rgba(58,140,74,.14);
  --diff-a-word: rgba(198,86,86,.30);
  --diff-b-word: rgba(58,140,74,.28);

  --link:       #3A6E9E;               /* darker blue for contrast on white */
  --code-bg:    #EFEFF1;
  --mono-stack: ui-monospace, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }

/* Tell the browser which scheme its native UI (scrollbars, form controls)
   should follow, so a light scrollbar never shows through in dark mode. */
:root                     { color-scheme: dark; }
:root[data-theme="light"] { color-scheme: light; }

/* Themed scrollbars to match, where the browser supports styling them. */
* { scrollbar-color: var(--border) transparent; }
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--border); border-radius: 7px;
  border: 3px solid transparent; background-clip: padding-box;
}
::-webkit-scrollbar-thumb:hover { background: var(--text-faint); background-clip: padding-box; }
body {
  background: var(--bg);
  color: var(--text);
  font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ---------- Top bar (toolbar) --------------------------------------------- */
#topbar {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  background: var(--pane-bg);
  border-bottom: 1px solid var(--border);
  flex: 0 0 auto;
  flex-wrap: wrap;
}
#topbar #brand {
  height: 22px; width: auto; flex: 0 0 auto;
  display: block; margin-right: 2px;
}
.spacer { flex: 1 1 auto; }

/* Segmented-toggle track holding chips (Workspace, Two-pane ops). */
.group {
  display: flex; align-items: center; gap: 2px;
  padding: 2px; border-radius: 7px;
  background: var(--track-bg);
  border: 1px solid var(--border);
}
/* The text-appearance group is a plain inline run, not a track. */
.group.plain {
  background: transparent; border: 0; padding: 0; gap: 6px;
}
.group .lbl { color: var(--text-dim); font-size: 12px; padding: 0 3px; white-space: nowrap; }
#diffInfo { color: var(--text-dim); font-size: 12px; white-space: nowrap; }

/* Base reset — every control paints its own surface per context below. */
button, select {
  font: inherit; cursor: pointer; color: var(--text);
  border: 0; background: transparent;
  transition: background .12s ease, border-color .12s ease, color .12s ease, box-shadow .12s ease;
}
button:focus-visible, select:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
button:disabled { opacity: .4; cursor: default; }
button:active:not(:disabled) { transform: translateY(.5px); }

/* Chips — controls sitting inside a .group track. */
.group button {
  padding: 5px 10px; border-radius: 6px;
  font-size: 12px; font-weight: 500; line-height: 1.4;
  color: var(--chip-text); background: transparent;
  white-space: nowrap;
}
.group button:hover:not(:disabled) { background: var(--chip-hover); color: var(--text); }
.group button.toggle.on {
  background: var(--chip-on-bg); color: var(--chip-on-text);
  box-shadow: var(--chip-on-shadow);
}
.group button.toggle.on:hover { background: var(--chip-on-bg); }
.group button:disabled:hover { background: transparent; color: var(--chip-text); }

/* icon-only chip (theme toggle) */
.iconbtn { padding: 5px 7px; display: inline-flex; align-items: center; }
.iconbtn svg { display: block; width: 15px; height: 15px; }
/* show the icon of the theme you'll switch TO (matches the Mono label convention) */
#themeBtn .moon { display: none; }
:root[data-theme="light"] #themeBtn .sun  { display: none; }
:root[data-theme="light"] #themeBtn .moon { display: block; }

input[type="range"] { width: 100px; accent-color: var(--range-accent); }

/* saved-to-autosave indicator */
#saveState {
  font-size: 12px; color: var(--text-dim);
  opacity: 0; transition: opacity .25s ease;
  min-width: 140px; text-align: right;
}
#saveState.show { opacity: 1; }
#saveState.done { color: var(--ok); }

/* version stamp — pinned to the right edge of the header */
#version {
  font-size: 11px; color: var(--text-faint);
  white-space: nowrap; letter-spacing: .02em;
  flex: 0 0 auto; margin-left: 2px;
}

/* ---------- Panes --------------------------------------------------------- */
#panes { flex: 1 1 auto; display: flex; min-height: 0; }
.pane {
  display: flex; flex-direction: column; min-width: 120px; min-height: 0;
  /* flex-basis is set from JS (persisted split ratio) */
}
.pane-bar {
  display: flex; align-items: center; gap: 5px;
  padding: 6px 8px;
  background: var(--pane-bg);
  border-bottom: 1px solid var(--border);
  border-top: 2px solid transparent;   /* tints when the pane is focused */
  flex: 0 0 auto;
  overflow: hidden;
}
.pane.focused .pane-bar { border-top-color: var(--pane-focus); }

/* Primary buttons — compact raised controls (Copy/Clear/Text/Save/Load). */
.pane-bar button {
  flex: 0 0 auto;
  height: 28px; padding: 0 9px;
  display: inline-flex; align-items: center;
  font-size: 12px; font-weight: 500;
  border-radius: 8px;
  background: var(--btn-bg); color: var(--text);
  border: 1px solid var(--btn-border);
  box-shadow: var(--btn-shadow);
  white-space: nowrap;
}
.pane-bar button:hover:not(:disabled) { background: var(--btn-hover); }
.pane-bar button.on { background: var(--btn-on-bg); color: var(--btn-on-text); border-color: transparent; }

/* Counts give way first — take the remaining space and ellipsize. */
.pane-bar .counts { flex: 1 1 auto; }

.counts {
  color: var(--text-dim); font-size: 12px; margin-left: auto;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}

/* Editor stack: a highlight layer painted *behind* a transparent textarea.
   Both use identical font, padding and wrapping so the glyphs line up. */
.editor {
  position: relative; flex: 1 1 auto; min-height: 0;
  background: var(--editor-bg);
  overflow: hidden;
}
.editor textarea,
.editor .layer {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  margin: 0; border: 0;
  padding: 14px 16px;
  line-height: 1.55;
  font-family: inherit;                /* JS sets the real family/size on both */
  white-space: pre-wrap;
  overflow-wrap: break-word;
  word-break: normal;
  tab-size: 4;
}
.editor textarea {
  resize: none; outline: none;
  background: transparent;             /* so the layer shows through */
  color: var(--editor-text);
  overflow-y: auto;
  z-index: 1;
}
.editor .layer {
  overflow: hidden;                    /* scrolled programmatically, in sync */
  color: transparent;                  /* only the marks are visible */
  pointer-events: none;
  z-index: 0;
  display: none;                       /* shown only in diff mode */
}
body.diff .editor .layer { display: block; }
.editor textarea::placeholder { color: var(--text-dim); opacity: .7; }
.editor textarea::selection { background: var(--sel); }

/* diff marks */
.layer .ln     { border-radius: 2px; }
.layer.a .ln   { background: var(--diff-a); box-shadow: 0 0 0 1px var(--diff-a); }
.layer.b .ln   { background: var(--diff-b); box-shadow: 0 0 0 1px var(--diff-b); }
.layer mark    { color: transparent; border-radius: 2px; }
.layer.a mark  { background: var(--diff-a-word); }
.layer.b mark  { background: var(--diff-b-word); }

/* ---------- Solo (single-pane) mode ---------------------------------------
   The hidden pane keeps its text and keeps autosaving; only its box is gone. */
body.solo .pane.hidden, body.solo #divider { display: none; }
body.solo .pane { flex: 1 1 auto !important; }   /* overrides the inline split */
/* Cap the text column so long prose lines stay readable on a wide display.
   Percentages resolve against the editor box, so the column self-centers. */
body.solo.narrow .editor textarea,
body.solo.narrow .editor .layer {
  padding-left:  max(14px, calc((100% - 72ch) / 2));
  padding-right: max(14px, calc((100% - 72ch) / 2));
}
/* solo-only controls */
#soloSwap, #wideBtn { display: none; }
body.solo #soloSwap, body.solo #wideBtn { display: inline-block; }

/* ---------- Markdown preview ----------------------------------------------
   A read-only rendered view that takes a pane's editor box in place of the
   textarea (the two swap on body/pane classes, like the diff layer). Same
   padding and font as the editor so toggling doesn't jump; heading, list and
   spacing sizes are in em, so the Size slider scales the whole document. */
.editor .preview {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  margin: 0; border: 0; padding: 14px 16px;
  font-family: inherit;
  color: var(--editor-text);
  overflow-wrap: break-word;
  overflow-y: auto;
  z-index: 2;
  display: none;
}
body.previewA #paneA .editor textarea,
body.previewA #paneA .editor .layer,
body.previewB #paneB .editor textarea,
body.previewB #paneB .editor .layer { display: none; }
body.previewA #paneA .editor .preview,
body.previewB #paneB .editor .preview { display: block; }
/* Same capped column the editor uses in solo-narrow, so the two agree. */
body.solo.narrow .editor .preview {
  padding-left:  max(14px, calc((100% - 72ch) / 2));
  padding-right: max(14px, calc((100% - 72ch) / 2));
}

/* Markdown typography. em-based so the app-wide Size slider rules them all. */
.preview > :first-child { margin-top: 0; }
.preview h1, .preview h2, .preview h3,
.preview h4, .preview h5, .preview h6 {
  font-weight: 600; line-height: 1.25; color: var(--text);
  margin: 1.4em 0 .45em;
}
.preview h1 { font-size: 1.75em; margin-top: .2em; }
.preview h2 { font-size: 1.4em; }
.preview h3 { font-size: 1.17em; }
.preview h4 { font-size: 1em; }
.preview h5 { font-size: .9em; }
.preview h6 { font-size: .82em; color: var(--text-dim); }
.preview p            { margin: .55em 0; }
.preview ul, .preview ol { margin: .55em 0; padding-left: 1.6em; }
.preview li           { margin: .18em 0; }
.preview li > p       { margin: .2em 0; }
.preview blockquote   {
  margin: .7em 0; padding: .1em 0 .1em 1em;
  border-left: 3px solid var(--pane-focus); color: var(--text-dim);
}
.preview code {
  font-family: var(--mono-stack); font-size: .88em;
  background: var(--code-bg); border-radius: 4px; padding: .1em .35em;
}
.preview pre {
  margin: .7em 0; padding: .7em .9em; border-radius: 6px;
  background: var(--code-bg); overflow-x: auto;
}
.preview pre code {
  background: none; border-radius: 0; padding: 0;
  font-size: .88em; line-height: 1.5;
  white-space: pre;
}
.preview a            { color: var(--link); text-decoration: none; }
.preview a:hover      { text-decoration: underline; }
.preview img          { max-width: 100%; border-radius: 4px; }
.preview hr           { border: 0; border-top: 1px solid var(--border); margin: 1.3em 0; }
.preview table        { border-collapse: collapse; margin: .7em 0; }
.preview th, .preview td {
  border: 1px solid var(--border); padding: .3em .7em; text-align: left;
}
.preview th           { background: var(--pane-bg); font-weight: 600; }
.preview .task        { list-style: none; margin-left: -1.2em; }
.preview .task input  { margin-right: .45em; vertical-align: -1px; accent-color: var(--pane-focus); }
.preview .task input:disabled { opacity: .75; }
.preview .task.done   { color: var(--text-dim); }
.preview .task.done input[type="checkbox"] { accent-color: var(--text-faint); }

/* ---------- Text menu -----------------------------------------------------
   Positioned from JS and attached to <body>, not to the pane bar: that bar is
   overflow:hidden so its buttons collapse gracefully in a narrow pane, which
   would clip a dropdown nested inside it. */
#textMenu {
  position: fixed; z-index: 40;
  min-width: 220px; max-width: 320px; padding: 10px;
  background: var(--pane-bg);
  border: 1px solid var(--border); border-radius: 10px;
  box-shadow: var(--menu-shadow);
  display: flex; flex-direction: column; gap: 9px;
  overflow-y: auto;
  transform-origin: top left;          /* grows out from under its button */
}
#textMenu[hidden] { display: none; }
/* Pop-in whenever the menu is shown (JS just clears [hidden]). */
#textMenu:not([hidden]) { animation: menuIn .14s cubic-bezier(.2,.7,.3,1); }
@keyframes menuIn {
  from { opacity: 0; transform: translateY(-4px) scale(.97); }
  to   { opacity: 1; transform: translateY(0)   scale(1);   }
}
@media (prefers-reduced-motion: reduce) {
  #textMenu:not([hidden]) { animation: none; }
}
#textMenu .row { display: flex; flex-wrap: wrap; gap: 5px; }
#textMenu .lbl {
  width: 100%; color: var(--text-faint);
  font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
}
#textMenu button {
  padding: 5px 9px; font-size: 12px; font-weight: 500;
  border-radius: 6px;
  background: var(--menu-item-bg); color: var(--text);
  border: 1px solid var(--border);
}
#textMenu button:hover:not(:disabled) { background: var(--btn-hover); }
#textMenu .intoBtn { width: 100%; text-align: left; }
#textMenu .intoBtn.on { background: var(--btn-on-bg); color: var(--btn-on-text); border-color: transparent; }
#textMenu .scope {
  color: var(--text-dim); font-size: 11px;
  border-top: 1px solid var(--border); padding-top: 7px;
}

/* ---------- Divider ------------------------------------------------------- */
#divider {
  flex: 0 0 6px;
  background: var(--pane-bg);
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  cursor: col-resize;
  touch-action: none;         /* let a touch drag resize instead of scroll */
  position: relative;
  transition: background .12s ease;
}
#divider::after {           /* faint center grip, revealed on hover / drag */
  content: ""; position: absolute; left: 2px; right: 2px; top: 50%;
  height: 30px; margin-top: -15px; border-radius: 2px;
  background: var(--text-faint); opacity: 0;
  transition: opacity .12s ease;
}
#divider:hover, body.dragging #divider { background: var(--track-bg); }
#divider:hover::after, body.dragging #divider::after { opacity: .5; }
body.dragging { cursor: col-resize; user-select: none; }
body.dragging textarea { pointer-events: none; }  /* keep drag smooth over textareas */

/* ---------- Cat companion -------------------------------------------------
   A cat that pops its head up over the bottom edge now and then, during quiet
   moments, then ducks back down. Two inline SVGs (one per theme) — no assets,
   no network. The layer ignores the pointer; only the cat itself is clickable,
   and it ducks away the instant anyone types, so it never covers text. */
#catBtn { color: var(--text-faint); padding: 4px 6px; display: inline-flex; align-items: center; flex: 0 0 auto; }
#catBtn svg { width: 19px; height: auto; display: block; }
#catBtn .catLight { display: none; }
:root[data-theme="light"] #catBtn .catDark  { display: none; }
:root[data-theme="light"] #catBtn .catLight { display: block; }
#catBtn:hover { color: var(--text-dim); }
#catBtn:active:not(:disabled) { transform: translateY(.5px); }
#catBtn[aria-expanded="true"] { color: var(--text); }

/* Cat menu — the friendliness levels and a "peek now" action, in the same
   card/animation language as the Text ▾ menu (#textMenu), kept independent
   so the cat stays a self-contained, drop-in block. */
#catMenu {
  position: fixed; z-index: 40;
  min-width: 150px; padding: 8px;
  background: var(--pane-bg);
  border: 1px solid var(--border); border-radius: 10px;
  box-shadow: var(--menu-shadow);
  display: flex; flex-direction: column; gap: 7px;
  transform-origin: top right;
}
#catMenu[hidden] { display: none; }
#catMenu:not([hidden]) { animation: menuIn .14s cubic-bezier(.2,.7,.3,1); }
@media (prefers-reduced-motion: reduce) { #catMenu:not([hidden]) { animation: none; } }
#catMenu .lbl {
  color: var(--text-faint);
  font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
}
#catMenu .row { display: flex; flex-wrap: wrap; gap: 5px; }
#catMenu button {
  padding: 5px 9px; font-size: 12px; font-weight: 500;
  border-radius: 6px;
  background: var(--menu-item-bg); color: var(--text);
  border: 1px solid var(--border);
}
#catMenu button:hover { background: var(--btn-hover); }
#catMenu .catMenuAction { text-align: left; }
#catMenu .row button.on { background: var(--btn-on-bg); color: var(--btn-on-text); border-color: transparent; }

/* Strip pinned to the bottom of the window; clips whatever hangs below it, so
   the cat is invisible until it rises into view. */
#catLayer {
  position: fixed; left: 0; right: 0; bottom: 0; height: 150px;
  pointer-events: none; overflow: hidden; z-index: 30;
}
.cat {
  position: absolute; bottom: 0;      /* bottom edge sits on the screen bottom */
  width: 104px;                        /* size — height follows the ~1.41 ratio */
  opacity: .92;                        /* overall presence — dial down for subtler */
  pointer-events: auto; cursor: pointer;
  transform: translateY(100%);         /* parked fully below the edge until it pops */
}
.cat > svg { display: block; width: 100%; height: auto; }

/* Two silhouettes; show the one that matches the current theme, and because
   this keys off data-theme it swaps instantly when the ☀️/🌙 toggle is used. */
.cat .catLight { display: none; }
:root[data-theme="light"] .cat .catDark  { display: none; }
:root[data-theme="light"] .cat .catLight { display: block; }

/* The visit: a simple rise on one easing curve, translateY(100%) → 0, a
   hold, then a duck back down on its own curve. No overshoot — the bottom
   edge arrives flush with the screen bottom and stays there. Tweak the 16%
   mark for how fast she arrives, and the 90% mark for how long she lingers. */
.cat.pop { animation: catPop var(--dur) forwards; }
@keyframes catPop {
  0%   { transform: translateY(100%); animation-timing-function: cubic-bezier(.22,.75,.32,1); } /* ease up   */
  16%  { transform: translateY(0);    animation-timing-function: linear; }                      /* arrived   */
  90%  { transform: translateY(0);    animation-timing-function: cubic-bezier(.55,0,.85,.4); }  /* duck down */
  100% { transform: translateY(100%); }
}

/* Ducks straight back down the moment someone starts typing. */
.cat.flee { animation: catFlee .3s ease-in forwards !important; }
@keyframes catFlee { to { transform: translateY(110%); } }

/* Blink — eyelids drop over the eyes for a slow, sleepy beat. Painted in the
   editor surface's own colour (not the cat's fill) — the layer sits over the
   editor, so this is what's actually behind her — so a closed eye disappears
   completely: no ring, no pupil-hole, just gone, the way a real cat's eye
   vanishes to a line when shut. A short opacity fade softens the open/close
   instead of a hard flash. Hidden until the .blink class is on; JS holds it
   on for ~260ms. */
.cat .lid { opacity: 0; fill: var(--editor-bg); transition: opacity 70ms ease; }
.cat.blink .lid { opacity: 1; }

/* The little reaction when the cat is clicked. */
.catHeart {
  position: absolute; pointer-events: none; white-space: nowrap;
  color: var(--text-dim); font-size: 25px; font-weight: 600;
  animation: catHeart 1.1s ease forwards;
}
@keyframes catHeart {
  from { opacity: 0; transform: translate(-50%, 6px) scale(.8); }
  20%  { opacity: 1; transform: translate(-50%, -2px) scale(1); }
  to   { opacity: 0; transform: translate(-50%, -44px) scale(1); }
}

@media (prefers-reduced-motion: reduce) { #catLayer { display: none; } }
</style>

<script>
(function () {
  "use strict";

  /* ==========================================================================
     Storage. Everything is namespaced: file:// pages share the "null" origin,
     so a unique prefix keeps other local HTML files from colliding with us.
     ========================================================================== */
  var PREFIX = "scratchpad_v1_";
  var K = {
    textA: PREFIX + "textA",
    textB: PREFIX + "textB",
    split: PREFIX + "split",      // left pane width, in percent
    size:  PREFIX + "fontSize",   // px
    mono:  PREFIX + "mono",       // "1" | "0"
    lock:  PREFIX + "scrollLock", // "1" | "0"
    diff:  PREFIX + "diff",       // "1" | "0"
    norm:  PREFIX + "diffNorm",   // "1" | "0"  — ignore typography when comparing
    theme: PREFIX + "theme",     // "dark" | "light"
    solo:  PREFIX + "solo",       // "1" | "0"  — single-pane mode
    soloPane: PREFIX + "soloPane",// "A" | "B"  — which pane solo mode shows
    wide:  PREFIX + "soloWide",   // "1" | "0"  — uncapped column in solo mode
    prevA: PREFIX + "previewA",   // "1" | "0"  — pane shows rendered markdown
    prevB: PREFIX + "previewB"
  };
  function get(k, dflt) {
    try { var v = localStorage.getItem(k); return v === null ? dflt : v; }
    catch (e) { return dflt; }            // private mode / storage disabled
  }
  /* Returns false when the write failed (quota full, storage disabled), so
     autosave can say so instead of claiming it saved. */
  function set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }

  /* ==========================================================================
     Element handles
     ========================================================================== */
  var panes = {
    A: { el: document.getElementById("paneA"), ta: document.getElementById("textA"),
         layer: document.getElementById("layerA"),
         count: document.getElementById("countA") },
    B: { el: document.getElementById("paneB"), ta: document.getElementById("textB"),
         layer: document.getElementById("layerB"),
         count: document.getElementById("countB") }
  };
  panes.A.prev = document.getElementById("prevA");
  panes.B.prev = document.getElementById("prevB");
  var saveState  = document.getElementById("saveState");
  var filePicker = document.getElementById("filePicker");
  var diffInfo   = document.getElementById("diffInfo");
  var focused = "A";   // which pane keyboard shortcuts act on

  /* ==========================================================================
     Autosave (debounced) + "saved" indicator
     ========================================================================== */
  var saveTimer = null, flashTimer = null;
  // Panes edited in THIS tab since the last save. Only those get written, so
  // a tab that has been sitting open never overwrites another tab's work
  // with its stale copy of a pane it didn't touch.
  var dirty = { A: false, B: false };
  function saveNow() {
    clearTimeout(saveTimer);
    saveTimer = null;
    var ok = true;
    ["A", "B"].forEach(function (id) {
      if (!dirty[id]) return;
      if (set(K["text" + id], panes[id].ta.value)) dirty[id] = false;
      else ok = false;
    });
    return ok;
  }
  function scheduleAutosave() {
    flash("saving…", false);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      flash(saveNow() ? "saved to local autosave" : "autosave FAILED — storage full? Save to a file", true);
    }, 400);
  }
  // Closing or hiding the tab inside the debounce window must not drop the
  // last keystrokes: write immediately whenever a save is still pending.
  function flushAutosave() { if (saveTimer !== null) saveNow(); }
  window.addEventListener("pagehide", flushAutosave);
  window.addEventListener("beforeunload", flushAutosave);
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) flushAutosave();
  });
  function flash(msg, done) {
    saveState.textContent = msg;
    saveState.className = "show" + (done ? " done" : "");
    clearTimeout(flashTimer);
    if (done) flashTimer = setTimeout(function () { saveState.className = ""; }, 1600);
  }

  /* ==========================================================================
     Markdown preview

     A pane can flip between editing and a rendered view of its markdown.
     Source text is never touched — toggling back hands the same textarea,
     with its caret and undo history, straight back.

     The renderer is deliberately small and hand-rolled: no library, no
     network, in keeping with the one-file ethos. It covers the markdown that
     actually turns up in notes and prompts — headings, lists, tables, code,
     quotes, emphasis, links, images — and escapes ALL raw HTML first, then
     builds its output from whitelisted tags only, so pasted content can
     never execute. Undersupported syntax simply shows as text; nothing is
     lost, since the source pane is always one keypress away.
     ========================================================================== */

  /* Escapes & < > " ' so source text can never break out into live markup.
     Quotes are included because attribute values are built from source. */
  function escAll(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  /* URLs are whitelisted, not blacklisted: http(s), mailto and same-page
     fragments pass; everything else (javascript:, data:, vbscript:, …)
     is dropped and the text shows unlinked. */
  function safeUrl(url) {
    var u = url.trim();
    if (/^(https?:|mailto:)/i.test(u)) return u;
    if (/^#/.test(u) || !/^[a-z][a-z0-9+.-]*:/i.test(u)) return u;  // fragment or relative
    return null;
  }

  /* Inline markdown → HTML: code spans first (their content is protected
     from every later pass), then backslash escapes (placeholdered out for
     the same reason), then images, links, strong, em, strike. Escaping of
     raw text happens before this function is called; code-span content and
     escaped characters are escaped here, at restore time. */
  function inlineMd(s) {
    var codes = [], escs = [];
    s = s.replace(/(`+)([\s\S]*?)\1/g, function (_, ticks, code) {
      codes.push(code.replace(/^ (.*) $/, "$1"));   // one padding space, CommonMark-style
      return "\u0001" + (codes.length - 1) + "\u0001";
    });

    s = escAll(s);

    // Backslash escapes must come out BEFORE the emphasis passes, or \*italic\*
    // would still read as emphasis around a stray backslash. Park each escaped
    // character behind a placeholder; it is already escAll-safe (it came out of
    // the escaped string), so it goes back verbatim at the end.
    s = s.replace(/\\([\\`*_{}\[\]()#+\-.!~>])/g, function (_, ch) {
      escs.push(ch);
      return "\u0002" + (escs.length - 1) + "\u0002";
    });

    // Images before links: ![alt](url) would otherwise parse as a link.
    // Quotes are already escaped here, so titles match &quot;…&quot;. The URL
    // tolerates one level of balanced parentheses so alert(1)) parses whole.
    // An unsafe URL (safeUrl → null) falls back to plain text — no leftover
    // brackets or parens from the half-matched syntax.
    s = s.replace(/!\[([^\]]*)\]\(((?:[^()\s]|\([^()\s]*\))+)(?:\s+&quot;(.*?)&quot;)?\)/g,
      function (_, alt, url) {
        var safe = safeUrl(url);
        if (!safe) return alt;
        return '<img src="' + safe + '" alt="' + alt + '">';
      });
    s = s.replace(/\[([^\]]+)\]\(((?:[^()\s]|\([^()\s]*\))+)(?:\s+&quot;(.*?)&quot;)?\)/g,
      function (_, text, url, title) {
        var safe = safeUrl(url);
        if (!safe) return text;
        return '<a href="' + safe + '"' + (title ? ' title="' + title + '"' : "") + ">" + text + "</a>";
      });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/__([^_]+)__/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*\w])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
    s = s.replace(/(^|[^_\w])_([^_\s][^_]*)_(?![\w])/g, "$1<em>$2</em>");
    s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");

    s = s.replace(/\u0002(\d+)\u0002/g, function (_, i) { return escs[+i]; });
    s = s.replace(/\u0001(\d+)\u0001/g, function (_, i) {
      return "<code>" + escAll(codes[+i]) + "</code>";
    });
    return s;
  }

  /* Block-level parser: walks lines, classifying into block containers.
     Lists nest via recursion (one level of indent = one nested list);
     everything else is flat. Returns an HTML string. */
  function mdBlocks(lines) {
    var out = [], i = 0;

    function inCell(s) { return inlineMd(s.trim()).replace(/\|/g, "&#124;"); }

    while (i < lines.length) {
      var line = lines[i];

      if (!line.trim()) { i++; continue; }                       // blank line

      var fence = line.match(/^ {0,3}(```+|~~~+)\s*([^`]*)$/);   // fenced code
      if (fence) {
        var closer = new RegExp("^ {0,3}" + fence[1].charAt(0) + "{"
                              + fence[1].length + ",}\\s*$");
        var code = [];
        i++;
        while (i < lines.length && !closer.test(lines[i])) code.push(lines[i++]);
        i++;                                                     // skip the closer (or run out)
        var lang = fence[2].trim().split(/\s+/)[0];
        out.push('<pre><code'
               + (lang && /^[\w+-]+$/.test(lang) ? ' data-lang="' + escAll(lang) + '"' : "")
               + ">" + escAll(code.join("\n")) + (code.length ? "\n" : "") + "</code></pre>");
        continue;
      }

      if (/^ {0,3}([-*_])(?:\s*\1){2,}\s*$/.test(line)) { out.push("<hr>"); i++; continue; }

      var h = line.match(/^ {0,3}(#{1,6})\s+(.*?)\s*#*\s*$/);    // ATX heading
      if (h) { out.push("<h" + h[1].length + ">" + inlineMd(h[2]) + "</h" + h[1].length + ">"); i++; continue; }

      if (/^ {0,3}>/.test(line)) {                               // blockquote, nestable
        var quote = [];
        while (i < lines.length && (/^ {0,3}>/.test(lines[i]) || (lines[i].trim() && quote.length))) {
          quote.push(lines[i++].replace(/^ {0,3}> ?/, ""));
        }
        out.push("<blockquote>" + mdBlocks(quote) + "</blockquote>");
        continue;
      }

      var table = line.match(/^ {0,3}(.+)\|/);                   // pipe table
      if (table && i + 1 < lines.length
          && /^ {0,3}[\s|:-]+-+[\s|:\-]*$/.test(lines[i + 1])
          && /\|/.test(lines[i + 1])) {
        var aligns = lines[i + 1].trim().replace(/^\||\|$/g, "").split("|")
          .map(function (c) {
            c = c.trim();
            return /^:-+:$/.test(c) ? ' style="text-align:center"'
                 : /-+:$/.test(c)   ? ' style="text-align:right"' : "";
          });
        var head = table[1].trim().replace(/^\|/, "").split("|");
        var html = "<table><thead><tr>";
        head.forEach(function (c, ci) {
          html += "<th" + (aligns[ci] || "") + ">" + inCell(c) + "</th>";
        });
        html += "</tr></thead><tbody>";
        i += 2;
        while (i < lines.length && lines[i].trim() && /\|/.test(lines[i])
               && /^ {0,3}\S/.test(lines[i])) {
          var row = lines[i].trim().replace(/^\||\|$/g, "").split("|");
          html += "<tr>";
          head.forEach(function (_, ci) {
            html += "<td" + (aligns[ci] || "") + ">"
                  + (row[ci] !== undefined ? inCell(row[ci]) : "") + "</td>";
          });
          html += "</tr>";
          i++;
        }
        html += "</tbody></table>";
        out.push(html);
        continue;
      }

      var li = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);      // list (nested)
      if (li) {
        var ordered = /\d/.test(li[2]);
        var base = li[1].length, items = [];
        while (i < lines.length) {
          var m = lines[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
          if (m && m[1].length <= base + 1) {                    // sibling item
            items.push({ text: m[3], rest: [] });
            i++;
            while (i < lines.length                              // continuation lines
                   && lines[i].trim()
                   && !/^(\s*)([-*+]|\d+[.)])\s+/.test(lines[i])
                   && !/^ {0,3}(#{1,6}\s|>|```|~~~)/.test(lines[i])
                   && !/^ {0,3}([-*_])(?:\s*\1){2,}\s*$/.test(lines[i])) {
              items[items.length - 1].rest.push(lines[i].replace(new RegExp("^ {0," + (base + 2) + "}"), ""));
              i++;
            }
            if (i < lines.length && !lines[i].trim()) {          // blank line: lookahead
              var save = i;
              i++;
              while (i < lines.length && !lines[i].trim()) i++;
              if (i >= lines.length || !/^(\s*)([-*+]|\d+[.)])\s+/.test(lines[i])) i = save;
            }
          } else if (m && m[1].length > base) {                  // deeper indent: recurse
            var deeper = [];
            while (i < lines.length
                   && (/^\s{2,}/.test(lines[i]) || !lines[i].trim())) {
              deeper.push(lines[i].replace(/^ {1,4}/, ""));
              i++;
            }
            // Hand the RAW de-indented lines to the mdBlocks() call below —
            // pushing rendered HTML here would get escaped all over again
            // and show as literal text.
            items[items.length - 1].rest.push.apply(items[items.length - 1].rest, deeper);
          } else break;
        }
        var tag = ordered ? "ol" : "ul";
        var list = "<" + tag + ">";
        items.forEach(function (it) {
          var task = it.text.match(/^\[( |x|X)\]\s+(.*)$/);
          if (task) {
            var done = task[1] !== " ";
            list += '<li class="task' + (done ? " done" : "") + '">'
                  + '<input type="checkbox" disabled' + (done ? " checked" : "") + ">"
                  + inlineMd(task[2]);
          } else {
            list += "<li>" + inlineMd(it.text);
          }
          if (it.rest.length) list += mdBlocks(it.rest);
          list += "</li>";
        });
        out.push(list + "</" + tag + ">");
        continue;
      }

      var para = [line];                                         // paragraph
      i++;
      while (i < lines.length && lines[i].trim()
             && !/^ {0,3}(#{1,6}\s|>|```|~~~)/.test(lines[i])
             && !/^(\s*)([-*+]|\d+[.)])\s+/.test(lines[i])
             && !/^ {0,3}([-*_])(?:\s*\1){2,}\s*$/.test(lines[i])) {
        para.push(lines[i++]);
      }
      out.push("<p>" + inlineMd(para.join("\n")).replace(/\n/g, "<br>") + "</p>");
    }
    return out.join("\n");
  }

  function renderMarkdown(src) {
    return mdBlocks(src.replace(/\r\n?/g, "\n").split("\n"));
  }

  /* Debounced re-render while a pane is being previewed: cheap enough to
     stay behind the keystroke, calm enough not to flicker. */
  var prevTimers = { A: null, B: null };
  function renderPreview(id) {
    if (!previewOn[id]) return;
    clearTimeout(prevTimers[id]);
    if (!panes[id].ta.value) {          // emptied (Clear): blank now, no lag
      panes[id].prev.innerHTML = "";
      return;
    }
    prevTimers[id] = setTimeout(function () {
      panes[id].prev.innerHTML = renderMarkdown(panes[id].ta.value);
    }, 250);
  }

  var previewOn = { A: false, B: false };
  function applyPreview(id, on) {
    previewOn[id] = !!on;
    document.body.classList.toggle("preview" + id, previewOn[id]);
    panes[id].prev.hidden = !previewOn[id];
    var btn = document.querySelector('button[data-act="prev"][data-pane="' + id + '"]');
    btn.classList.toggle("on", previewOn[id]);
    btn.setAttribute("aria-pressed", previewOn[id] ? "true" : "false");
    set(K["prev" + id], previewOn[id] ? "1" : "0");
    if (previewOn[id]) {
      panes[id].prev.innerHTML = renderMarkdown(panes[id].ta.value);   // now, not debounced
    } else {
      clearTimeout(prevTimers[id]);
    }
  }

  /* ==========================================================================
     Counts
     ========================================================================== */
  function updateCounts(id) {
    var p = panes[id], v = p.ta.value;
    var words = v.trim() ? v.trim().split(/\s+/).length : 0;
    p.count.textContent = words.toLocaleString() + (words === 1 ? " word · " : " words · ")
                        + v.length.toLocaleString() + " chars";
  }

  /* Call after any change to a textarea's value. */
  function changed(id) { dirty[id] = true; updateCounts(id); scheduleAutosave(); scheduleDiff(); renderPreview(id); }

  /* ==========================================================================
     Several tabs open at once. Every tab shares one autosave, so when another
     tab saves a pane, take its text here — otherwise this tab keeps a stale
     copy and the next save here would overwrite that work.
     ========================================================================== */
  window.addEventListener("storage", function (e) {
    if (e.storageArea !== localStorage || e.newValue === null) return;
    var id = e.key === K.textA ? "A" : e.key === K.textB ? "B" : null;
    if (!id) return;
    var ta = panes[id].ta;
    if (ta.value === e.newValue) return;
    if (dirty[id]) {
      // Both tabs edited this pane within the same moment. Keep ours: it saves
      // in a moment and the other tab picks it up — say so rather than
      // resolving it silently.
      flash("pane " + id + " was also edited in another tab — keeping this tab's text", true);
      return;
    }
    // Assigning .value clears this pane's undo history in this tab; that is
    // the price of not keeping stale text. Caret and scroll stay put.
    var s = ta.selectionStart, en = ta.selectionEnd, top = ta.scrollTop;
    ta.value = e.newValue;
    ta.setSelectionRange(Math.min(s, ta.value.length), Math.min(en, ta.value.length));
    ta.scrollTop = top;
    updateCounts(id);
    scheduleDiff();
    renderPreview(id);
    flash("pane " + id + " updated from another tab", true);
  });

  /* ==========================================================================
     Diff — line-level LCS, refined to word level inside aligned changed blocks.
     Results are painted onto the .layer behind each textarea.
     ========================================================================== */
  var diffOn = false, diffTimer = null;
  var normOn = false;   // ignore typography when comparing

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  /* Longest-common-subsequence alignment over an array of tokens/lines.
     Returns ops: {t:"eq"|"del"|"ins", a:indexInA, b:indexInB}. */
  function lcs(a, b) {
    var n = a.length, m = b.length, ops = [], i, j;

    // Trim identical head/tail first — cheap, and it keeps the DP small.
    var head = 0;
    while (head < n && head < m && a[head] === b[head]) head++;
    var tail = 0;
    while (tail < n - head && tail < m - head && a[n - 1 - tail] === b[m - 1 - tail]) tail++;

    for (i = 0; i < head; i++) ops.push({ t: "eq", a: i, b: i });

    var an = n - tail - head, bn = m - tail - head;
    // Guard against pathological sizes: fall back to "everything here changed".
    if (an * bn > 4000000) {
      for (i = 0; i < an; i++) ops.push({ t: "del", a: head + i, b: -1 });
      for (j = 0; j < bn; j++) ops.push({ t: "ins", a: -1, b: head + j });
    } else {
      // DP table of LCS lengths over the middle sections. A typed array is
      // zero-filled for free and a fraction of the memory of a plain Array,
      // which matters at up to 4M cells rebuilt on every diff pass.
      var dp = new Uint32Array((an + 1) * (bn + 1));
      var W = bn + 1;
      for (i = an - 1; i >= 0; i--) {
        for (j = bn - 1; j >= 0; j--) {
          dp[i * W + j] = (a[head + i] === b[head + j])
            ? dp[(i + 1) * W + (j + 1)] + 1
            : Math.max(dp[(i + 1) * W + j], dp[i * W + (j + 1)]);
        }
      }
      i = 0; j = 0;
      while (i < an && j < bn) {
        if (a[head + i] === b[head + j]) { ops.push({ t: "eq", a: head + i, b: head + j }); i++; j++; }
        else if (dp[(i + 1) * W + j] >= dp[i * W + (j + 1)]) { ops.push({ t: "del", a: head + i, b: -1 }); i++; }
        else { ops.push({ t: "ins", a: -1, b: head + j }); j++; }
      }
      while (i < an) { ops.push({ t: "del", a: head + i, b: -1 }); i++; }
      while (j < bn) { ops.push({ t: "ins", a: -1, b: head + j }); j++; }
    }

    for (i = 0; i < tail; i++) ops.push({ t: "eq", a: n - tail + i, b: m - tail + i });
    return ops;
  }

  /* Word-level diff of two lines → escaped HTML with <mark> around the parts
     that are unique to that side. */
  function wordMarks(lineA, lineB, cmpA, cmpB) {
    var ta = lineA.split(/(\s+)/), tb = lineB.split(/(\s+)/);

    // Compare softened tokens but emit the original ones, so Normalise stops
    // a curly quote reading as a real word change without the layer ever
    // showing text the pane does not contain. Softening rewrites characters
    // inside tokens and never splits them, so the arrays line up — but if
    // that ever stopped being true, comparing the originals is the safe
    // answer, not emitting a token from the wrong array.
    var ka = (cmpA === undefined ? lineA : cmpA).split(/(\s+)/);
    var kb = (cmpB === undefined ? lineB : cmpB).split(/(\s+)/);
    if (ka.length !== ta.length || kb.length !== tb.length) { ka = ta; kb = tb; }

    var ops = lcs(ka, kb);
    var outA = "", outB = "", openA = false, openB = false;
    function pushA(txt, mark) {
      if (mark !== openA) { outA += mark ? "<mark>" : "</mark>"; openA = mark; }
      outA += esc(txt);
    }
    function pushB(txt, mark) {
      if (mark !== openB) { outB += mark ? "<mark>" : "</mark>"; openB = mark; }
      outB += esc(txt);
    }
    ops.forEach(function (o) {
      if (o.t === "eq")      { pushA(ta[o.a], false); pushB(tb[o.b], false); }
      else if (o.t === "del") pushA(ta[o.a], true);
      else                    pushB(tb[o.b], true);
    });
    if (openA) outA += "</mark>";
    if (openB) outB += "</mark>";
    return [outA, outB];
  }

  function renderDiff() {
    if (!diffOn || soloOn) return;   // nothing to compare against while solo
    var A = panes.A.ta.value, B = panes.B.ta.value;
    var la = A.split("\n"), lb = B.split("\n");

    // With Normalise on, the COMPARISON runs on straightened copies while the
    // layers still render the original lines. Neither transform adds or
    // removes a newline, so line indices still line up — which matters,
    // because the layer is painted behind the textarea and any drift in
    // length would show as misaligned highlighting.
    var ca = la, cb = lb;
    if (normOn) {
      var soften = function (line) { return xStraighten(xStripInvisibles(line)); };
      ca = la.map(soften); cb = lb.map(soften);
    }
    var ops = lcs(ca, cb);

    // htmlA/htmlB are built line by line, index-aligned with each pane's text.
    var htmlA = new Array(la.length), htmlB = new Array(lb.length);
    var nChanged = 0, nAdded = 0, nRemoved = 0;

    // Walk the ops, grouping consecutive del/ins runs so we can pair them up.
    var i = 0;
    while (i < ops.length) {
      var o = ops[i];
      if (o.t === "eq") { htmlA[o.a] = esc(la[o.a]); htmlB[o.b] = esc(lb[o.b]); i++; continue; }

      var dels = [], inss = [];
      while (i < ops.length && ops[i].t !== "eq") {
        if (ops[i].t === "del") dels.push(ops[i].a); else inss.push(ops[i].b);
        i++;
      }
      // Classify the block: paired lines are edits ("changed"); any surplus on
      // one side is a pure addition (right-only) or removal (left-only).
      var paired = Math.min(dels.length, inss.length);
      nChanged += paired;
      nRemoved += dels.length - paired;
      nAdded   += inss.length - paired;

      // Same number of lines on both sides → treat them as edited pairs and
      // refine to word level. Otherwise mark the whole lines.
      if (dels.length === inss.length) {
        for (var k = 0; k < dels.length; k++) {
          var pair = wordMarks(la[dels[k]], lb[inss[k]], ca[dels[k]], cb[inss[k]]);
          htmlA[dels[k]] = '<span class="ln">' + (pair[0] || " ") + "</span>";
          htmlB[inss[k]] = '<span class="ln">' + (pair[1] || " ") + "</span>";
        }
      } else {
        dels.forEach(function (ix) { htmlA[ix] = '<span class="ln">' + (esc(la[ix]) || " ") + "</span>"; });
        inss.forEach(function (ix) { htmlB[ix] = '<span class="ln">' + (esc(lb[ix]) || " ") + "</span>"; });
      }
    }

    // The trailing space matters: a textarea whose text ends in "\n" shows an
    // empty last line, but a div drops it. Without the space the layer is one
    // line shorter, can't scroll as far, and its marks drift a line off near
    // the bottom of the pane.
    panes.A.layer.innerHTML = htmlA.join("\n") + " ";
    panes.B.layer.innerHTML = htmlB.join("\n") + " ";
    syncLayer("A"); syncLayer("B");

    // Typed, git-style summary: "N changed · +A · −R" (parts shown only if nonzero).
    if (!A && !B) {
      diffInfo.textContent = "";
    } else if (!nChanged && !nAdded && !nRemoved) {
      diffInfo.textContent = "identical";
    } else {
      var parts = [];
      if (nChanged) parts.push(nChanged + " changed");
      if (nAdded)   parts.push("+" + nAdded);        // lines only in the right pane
      if (nRemoved) parts.push("\u2212" + nRemoved); // lines only in the left pane (U+2212)
      diffInfo.textContent = parts.join(" \u00b7 ");
    }
  }

  function scheduleDiff() {
    if (!diffOn) return;
    clearTimeout(diffTimer);
    diffTimer = setTimeout(renderDiff, 120);
  }

  /* Keep a highlight layer aligned with its textarea (size + scroll offset).
     clientWidth/Height exclude the textarea's scrollbar, so wrapping matches. */
  function syncLayer(id) {
    var p = panes[id];
    p.layer.style.width  = p.ta.clientWidth + "px";
    p.layer.style.height = p.ta.clientHeight + "px";
    syncLayerScroll(id);
  }
  /* Scrolling only moves the offset, so skip the size reads (which force a
     layout) on every scroll frame — and skip it all while diff is off. */
  function syncLayerScroll(id) {
    if (!diffOn) return;
    var p = panes[id];
    p.layer.scrollTop  = p.ta.scrollTop;
    p.layer.scrollLeft = p.ta.scrollLeft;
  }

  var normBtn = document.getElementById("normBtn");
  function applyNorm(on) {
    normOn = !!on;
    normBtn.classList.toggle("on", normOn);
    set(K.norm, normOn ? "1" : "0");
    renderDiff();
  }
  normBtn.addEventListener("click", function () {
    applyNorm(!normOn);
    flash(normOn ? "ignoring typography when comparing" : "comparing exactly", true);
  });

  var diffBtn = document.getElementById("diffBtn");
  function applyDiff(on) {
    diffOn = !!on;
    document.body.classList.toggle("diff", diffOn);
    diffBtn.classList.toggle("on", diffOn);
    set(K.diff, diffOn ? "1" : "0");
    if (diffOn) renderDiff();
    else {
      panes.A.layer.innerHTML = "";
      panes.B.layer.innerHTML = "";
      diffInfo.textContent = "";
    }
  }
  diffBtn.addEventListener("click", function () { applyDiff(!diffOn); });

  /* ==========================================================================
     Scroll lock — scroll one pane, the other follows. Absolute offsets, so
     near-identical texts stay line-for-line; clamped to each pane's range.
     ========================================================================== */
  var lockOn = false, syncingScroll = false;
  var lockBtn = document.getElementById("lockBtn");
  function applyLock(on) {
    lockOn = !!on;
    lockBtn.classList.toggle("on", lockOn);
    set(K.lock, lockOn ? "1" : "0");
    if (lockOn) mirrorScroll(focused);   // align immediately when switched on
  }
  lockBtn.addEventListener("click", function () { applyLock(!lockOn); });

  function mirrorScroll(from) {
    var to = from === "A" ? "B" : "A";
    var src = panes[from].ta, dst = panes[to].ta;
    var max = dst.scrollHeight - dst.clientHeight;
    syncingScroll = true;
    dst.scrollTop = Math.max(0, Math.min(max, src.scrollTop));
    syncingScroll = false;
    syncLayerScroll(to);
  }

  ["A", "B"].forEach(function (id) {
    panes[id].ta.addEventListener("scroll", function () {
      if (previewOn[id]) return;              // hidden while previewing; nothing to align
      syncLayerScroll(id);
      if (lockOn && !syncingScroll) mirrorScroll(id);
    });
  });

  /* ==========================================================================
     Solo (single-pane) mode.

     you were just editing. The other pane keeps its content and its autosave;
     it comes straight back when you return to the split view.
     ========================================================================== */
  var soloOn = false, soloPane = "A", wideOn = false;
  var soloBtn  = document.getElementById("soloBtn");
  var soloSwap = document.getElementById("soloSwap");
  var wideBtn  = document.getElementById("wideBtn");

  function applySolo(on, which) {
    soloOn = !!on;
    if (which) soloPane = which;
    var other = soloPane === "A" ? "B" : "A";

    document.body.classList.toggle("solo", soloOn);
    panes[soloPane].el.classList.toggle("hidden", false);
    panes[other].el.classList.toggle("hidden", soloOn);

    // Labels read as "what clicking gives you", like the Mono / Light buttons.
    soloBtn.textContent  = soloOn ? "Split view" : "Single pane";
    soloSwap.textContent = "Show pane " + other;

    // Comparing needs two panes — disable rather than hide, so the bar
    // doesn't reflow, and the toggles keep their state for the way back.
    lockBtn.disabled = soloOn;
    diffBtn.disabled = soloOn;
    pushR.disabled = soloOn;   // pushing into a hidden pane makes no sense
    pushL.disabled = soloOn;

    set(K.solo, soloOn ? "1" : "0");
    set(K.soloPane, soloPane);

    if (soloOn) {
      panes.A.layer.innerHTML = "";     // drop any stale diff marks
      panes.B.layer.innerHTML = "";
      diffInfo.textContent = "";
      panes[soloPane].ta.focus();
    } else {
      applySplit(parseFloat(get(K.split, "50")) || 50);
      renderDiff();                     // repaint if diff was left on
    }

  }
  soloBtn.addEventListener("click", function () {
    applySolo(!soloOn, soloOn ? null : focused);   // collapse to the focused pane
  });
  soloSwap.addEventListener("click", function () {
    applySolo(true, soloPane === "A" ? "B" : "A");
  });

  /* Reading column: capped by default, "Wide" releases it for pasted tables. */
  function applyWide(on) {
    wideOn = !!on;
    document.body.classList.toggle("narrow", !wideOn);
    wideBtn.textContent = wideOn ? "Narrow" : "Wide";
    set(K.wide, wideOn ? "1" : "0");
    syncLayer("A"); syncLayer("B");
  }
  wideBtn.addEventListener("click", function () { applyWide(!wideOn); });

  /* ==========================================================================
     Theme / font size / font face
     ========================================================================== */
  var PROP_STACK = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
  var MONO_STACK = 'ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace';

  var fontRange = document.getElementById("fontRange");
  var fontVal   = document.getElementById("fontVal");
  /* Font settings go on the textarea *and* its layer, so glyphs stay aligned. */
  function styleBoth(prop, value) {
    ["A", "B"].forEach(function (id) {
      panes[id].ta.style[prop] = value;
      panes[id].layer.style[prop] = value;
      panes[id].prev.style[prop] = value;   // preview follows Size and Mono too
    });
