  function applySize(px) {
    px = Math.max(12, Math.min(28, px | 0));
    styleBoth("fontSize", px + "px");
    fontRange.value = px;
    fontVal.textContent = px + "px";
    set(K.size, px);
    syncLayer("A"); syncLayer("B");
  }
  fontRange.addEventListener("input", function () { applySize(+fontRange.value); });
  document.getElementById("fontUp").addEventListener("click",   function () { applySize(+fontRange.value + 1); });
  document.getElementById("fontDown").addEventListener("click", function () { applySize(+fontRange.value - 1); });

  var faceBtn = document.getElementById("fontFace");
  var monoOn = false;
  function applyMono(on) {
    monoOn = !!on;
    styleBoth("fontFamily", monoOn ? MONO_STACK : PROP_STACK);
    faceBtn.textContent = monoOn ? "Proportional" : "Mono";   // label = what clicking gives you
    set(K.mono, monoOn ? "1" : "0");
    syncLayer("A"); syncLayer("B");
  }
  faceBtn.addEventListener("click", function () { applyMono(!monoOn); });

  /* Light / dark theme. Dark is the default; the button shows the icon of the
     theme you'll switch to (sun = go light, moon = go dark). */
  var themeBtn = document.getElementById("themeBtn");
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    set(K.theme, t);
  }
  themeBtn.addEventListener("click", function () {
    var now = document.documentElement.getAttribute("data-theme");
    applyTheme(now === "light" ? "dark" : "light");
  });

  /* ==========================================================================
     Split / draggable divider (persisted as left-pane percentage)
     ========================================================================== */
  var divider = document.getElementById("divider");
  var panesWrap = document.getElementById("panes");
  function applySplit(pct) {
    pct = Math.max(12, Math.min(88, pct));
    panes.A.el.style.flex = "0 0 " + pct + "%";
    panes.B.el.style.flex = "1 1 auto";
    set(K.split, pct);
    syncLayer("A"); syncLayer("B");
  }
  /* Pointer events (not mouse), so a touchscreen or pen can drag it too. */
  divider.addEventListener("pointerdown", function (e) {
    if (e.button !== 0) return;
    e.preventDefault();
    document.body.classList.add("dragging");
    function move(ev) {
      var r = panesWrap.getBoundingClientRect();
      applySplit(((ev.clientX - r.left) / r.width) * 100);
    }
    function up() {
      document.body.classList.remove("dragging");
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", up);
      document.removeEventListener("pointercancel", up);
    }
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up);
    document.addEventListener("pointercancel", up);
  });
  /* Double-click the divider to reset to 50/50. */
  divider.addEventListener("dblclick", function () { applySplit(50); });

  window.addEventListener("resize", function () { syncLayer("A"); syncLayer("B"); });

  /* ==========================================================================
     Editing through the browser's own undo stack

     Everything that changes a textarea goes through edit() rather than
     assigning .value. Assigning wipes the browser's undo history outright,
     which is why this app used to carry a one-slot "undo the last clear"
     buffer instead of real undo. execCommand("insertText") is deprecated but
     is still the only way to change a textarea as though a person typed it,
     so each edit becomes one Ctrl/Cmd+Z step and typing, transforms, clears
     and loads all unwind in the order they happened.
     ========================================================================== */
  /* By default the new text is left selected, so a transform or load shows
     what it touched. caretAfter puts the caret after it instead — for typing
     (Tab), where a selected tab would be overwritten by the next keystroke. */
  function edit(id, start, end, text, caretAfter) {
    var ta = panes[id].ta;
    if (start === end && text === "") return;   // "delete" here would eat a char
    ta.focus();
    // execCommand acts on whatever has focus. A hidden pane (single-pane
    // mode) can't take focus, so it would land in the visible pane instead —
    // write directly there, without an undo step.
    if (document.activeElement !== ta) {
      ta.setRangeText(text, start, end, "end");
      changed(id);
      return;
    }
    ta.setSelectionRange(start, end);
    var ok = false;
    try {
      ok = text === "" ? document.execCommand("delete") : document.execCommand("insertText", false, text);
    } catch (e) {}
    if (!ok) {
      // No current browser lands here; a silent no-op would be worse than
      // losing the undo step, so fall back and say so.
      ta.setRangeText(text, start, end, "end");
      changed(id);
      flash("done — this browser could not record an undo step", true);
      return;
    }
    if (caretAfter) ta.setSelectionRange(start + text.length, start + text.length);
    else ta.setSelectionRange(start, start + text.length);
    // execCommand fires 'input', so changed() runs through the normal listener.
  }

  /* ==========================================================================
     Text transforms

     Pure string -> string, ported from the MekoHub hub's Slate panel so the
     two behave identically. Each runs on the selection when there is one and
     on the whole pane otherwise.
     ========================================================================== */
  var INVISIBLE = /[\u200B-\u200D\uFEFF\u2060]/g;              // zero-width junk
  var ODD_SPACE = /[\u00A0\u2000-\u200A\u202F\u205F\u3000]/g;  // NBSP and friends

  function xStripInvisibles(s) { return s.replace(INVISIBLE, "").replace(ODD_SPACE, " "); }

  /* One-way and lossy on purpose: this is for text heading into code, a URL
     or a form that will mangle a typographer's quote. */
  function xStraighten(s) {
    return s.replace(/[‘’‚‛]/g, "'")
            .replace(/[“”„‟]/g, '"')
            .replace(/…/g, "...")
            .replace(/[–—‒―]/g, "-");
  }

  /* Rejoin lines hard-wrapped by a PDF, an email client or a terminal.
     Blank lines are paragraph breaks and survive. */
  function xUnwrap(s) {
    return s.split(/\n[ \t]*\n+/).map(function (para) {
      return para.replace(/[ \t]*\n[ \t]*/g, " ").trim();
    }).join("\n\n");
  }

  function xTrim(s) {
    return s.replace(/[ \t]+$/gm, "").replace(/\n{3,}/g, "\n\n").trim();
  }

  /* Block-level tags become line breaks first, so the text keeps the shape it
     had on the page instead of collapsing into one run. */
  function xStripHtml(s) {
    var withBreaks = s.replace(/<\s*br\s*\/?\s*>/gi, "\n")
                      .replace(/<\s*\/\s*(p|div|li|h[1-6]|tr)\s*>/gi, "\n");
    var doc = new DOMParser().parseFromString(withBreaks, "text/html");
    return (doc.body.textContent || "").replace(/\n{3,}/g, "\n\n").trim();
  }

  function xUpper(s) { return s.toUpperCase(); }
  function xLower(s) { return s.toLowerCase(); }

  /* Deliberately naive — it does not know about "of". Word starts are found
     by hand rather than with \b, which is ASCII-only and treats an apostrophe
     as a word break ("don't" → "Don'T", "élan" → "éLan"). */
  function xTitle(s) {
    return s.toLowerCase().replace(/(^|[^\p{L}\p{N}'’])(\p{L})/gu,
      function (_, lead, c) { return lead + c.toUpperCase(); });
  }

  function xSentence(s) {
    return s.toLowerCase().replace(/(^|[.!?]\s+|\n\s*)(\p{L})/gu,
      function (_, lead, c) { return lead + c.toUpperCase(); });
  }

  /* Line ops keep a trailing newline rather than turning it into an empty
     last line to sort. */
  function onLines(s, fn) {
    var trailing = s.charAt(s.length - 1) === "\n";
    var lines = (trailing ? s.slice(0, -1) : s).split("\n");
    return fn(lines).join("\n") + (trailing ? "\n" : "");
  }

  function xSort(s) {
    return onLines(s, function (l) {
      return l.slice().sort(function (a, b) { return a.localeCompare(b, undefined, { sensitivity: "base" }); });
    });
  }
  function xDedupe(s) {
    return onLines(s, function (l) {
      var seen = {}, out = [];
      l.forEach(function (line) {
        if (!Object.prototype.hasOwnProperty.call(seen, line)) { seen[line] = 1; out.push(line); }
      });
      return out;
    });
  }
  function xReverse(s) { return onLines(s, function (l) { return l.slice().reverse(); }); }
  function xNumber(s) {
    return onLines(s, function (l) {
      var width = String(l.length).length;
      return l.map(function (line, i) {
        var n = String(i + 1);
        while (n.length < width) n = " " + n;
        return n + ". " + line;
      });
    });
  }
  var TRANSFORMS = [
    { group: "Clean", items: [
      { label: "Unwrap",     hint: "Rejoin hard-wrapped lines, keeping paragraphs", fn: xUnwrap },
      { label: "Trim",       hint: "Trailing spaces off, blank-line runs collapsed", fn: xTrim },
      { label: "Invisibles", hint: "Zero-width characters out, odd spaces to plain ones", fn: xStripInvisibles },
      { label: "Straighten", hint: "Curly quotes, ellipses and dashes to ASCII", fn: xStraighten },
      { label: "De-tag",     hint: "Strip HTML, keeping the line structure", fn: xStripHtml }
    ]},
    { group: "Case", items: [
      { label: "UPPER",    hint: "Uppercase", fn: xUpper },
      { label: "lower",    hint: "Lowercase", fn: xLower },
      { label: "Title",    hint: "Capitalise every word", fn: xTitle },
      { label: "Sentence", hint: "Capitalise after each sentence ending", fn: xSentence }
    ]},
    { group: "Lines", items: [
      { label: "Sort",    hint: "Alphabetical, case-insensitive", fn: xSort },
      { label: "Dedupe",  hint: "Drop repeated lines, keeping the first", fn: xDedupe },
      { label: "Reverse", hint: "Last line first", fn: xReverse },
      { label: "Number",  hint: "Prefix each line with its number", fn: xNumber }
    ]}
  ];

  /* Session-only, and deliberately not persisted: writing into the other pane
     overwrites it, and that should never be a surprise left over from
     yesterday. The menu button's label says when it is on. */
  var intoOther = false;

  function otherPane(id) { return id === "A" ? "B" : "A"; }

  function applyTransform(id, item) {
    var ta = panes[id].ta;
    var whole = ta.selectionStart === ta.selectionEnd;
    var start = whole ? 0 : ta.selectionStart;
    var end   = whole ? ta.value.length : ta.selectionEnd;
    var source = ta.value.slice(start, end);

    if (!source) { flash("nothing to work on", true); return; }

    var result;
    try {
      result = item.fn(source);
    } catch (err) {
      flash(item.label + " failed — " + (err && err.message ? err.message : "unrecognised input"), true);
      return;
    }

    if (intoOther) {
      var to = otherPane(id);
      edit(to, 0, panes[to].ta.value.length, result);
      flash(item.label + " — pane " + id + " → pane " + to, true);
      return;
    }

    if (result === source) { flash(item.label + " — nothing to change", true); return; }
    edit(id, start, end, result);
  }

  /* ==========================================================================
     Transform menu

     One menu element, rebuilt for whichever pane opened it. Built from
     TRANSFORMS rather than written out twice, so adding a transform is one
     line in that table.
     ========================================================================== */
  var textMenu = document.getElementById("textMenu");
  var menuPane = null;   // which pane the open menu acts on, null when closed

  function menuButton(id) {
    return document.querySelector('button[data-act="menu"][data-pane="' + id + '"]');
  }

  function labelMenuButtons() {
    ["A", "B"].forEach(function (id) {
      var b = menuButton(id);
      // The label carries the "into the other pane" state, so a transform can
      // never quietly land somewhere unexpected.
      b.textContent = intoOther ? "Text →" + otherPane(id) : "Text ▾";
      b.classList.toggle("toggle", intoOther);
      b.classList.toggle("on", intoOther);
    });
  }

  function buildMenu(id) {
    textMenu.innerHTML = "";

    var into = document.createElement("button");
    into.className = "intoBtn toggle" + (intoOther ? " on" : "");
    into.textContent = "Put the result in pane " + otherPane(id);
    into.title = "Leaves this pane untouched, so you can diff the two";
    into.addEventListener("click", function () {
      intoOther = !intoOther;
      labelMenuButtons();
      buildMenu(id);           // redraw in place, menu stays open
    });
    textMenu.appendChild(into);

    TRANSFORMS.forEach(function (g) {
      var row = document.createElement("div");
      row.className = "row";
      var lbl = document.createElement("span");
      lbl.className = "lbl";
      lbl.textContent = g.group;
      row.appendChild(lbl);

      g.items.forEach(function (item) {
        var b = document.createElement("button");
        b.textContent = item.label;
        b.title = item.hint;
        b.addEventListener("click", function () {
          applyTransform(id, item);
          closeMenu();
        });
        row.appendChild(b);
      });
      textMenu.appendChild(row);
    });

    var scope = document.createElement("div");
    scope.className = "scope";
    var ta = panes[id].ta;
    scope.textContent = ta.selectionStart === ta.selectionEnd
      ? "Acting on all of pane " + id + "."
      : "Acting on the selection in pane " + id + ".";
    textMenu.appendChild(scope);
  }

  function openMenu(id, btn) {
    buildMenu(id);
    menuPane = id;
    textMenu.hidden = false;
    btn.setAttribute("aria-expanded", "true");

    // Anchor under the button, then pull back inside the viewport if it would
    // hang off the right edge in a narrow pane.
    var r = btn.getBoundingClientRect();
    var w = textMenu.offsetWidth;
    var left = Math.max(6, Math.min(r.left, window.innerWidth - w - 6));
    textMenu.style.left = left + "px";
    textMenu.style.top = (r.bottom + 5) + "px";
    // On a short window, scroll inside the menu rather than off the bottom.
    textMenu.style.maxHeight = Math.max(120, window.innerHeight - r.bottom - 11) + "px";
  }

  function closeMenu() {
    if (menuPane === null) return;
    var btn = menuButton(menuPane);
    if (btn) btn.setAttribute("aria-expanded", "false");
    textMenu.hidden = true;
    menuPane = null;
  }

  function toggleMenu(id, btn) {
    if (menuPane === id) { closeMenu(); return; }
    closeMenu();
    openMenu(id, btn);
  }

  // Clicking anywhere else, or Escape, closes it. The menu's own clicks are
  // excluded so the "into the other pane" toggle can be flipped in place.
  document.addEventListener("mousedown", function (e) {
    if (menuPane === null) return;
    if (textMenu.contains(e.target)) return;
    if (e.target.closest && e.target.closest('button[data-act="menu"]')) return;
    closeMenu();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeMenu();
  });
  window.addEventListener("resize", closeMenu);

  /* ==========================================================================
     Pane actions: copy / clear / save / load
     ========================================================================== */
  function doCopy(id) {
    var ta = panes[id].ta;
    if (!ta.value) { flash("nothing to copy", true); return; }
    // Async Clipboard API is unavailable on some file:// setups — fall back to execCommand.
    var fallback = function () {
      var sel = [ta.selectionStart, ta.selectionEnd];
      ta.focus(); ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      ta.setSelectionRange(sel[0], sel[1]);
      flash(ok ? "copied pane " + id : "copy failed — use Ctrl/Cmd+C", true);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ta.value)
        .then(function () { flash("copied pane " + id, true); })
        .catch(fallback);
    } else { fallback(); }
  }

  function doClear(id) {
    var ta = panes[id].ta;
    if (!ta.value) return;
    edit(id, 0, ta.value.length, "");
    flash("cleared pane " + id + " — Ctrl/Cmd+Z to undo", true);
  }

  /* Filename default: slug of the first non-empty line, else a timestamp. */
  function stamp() {
    var d = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate())
         + "-" + p(d.getHours()) + p(d.getMinutes());
  }
  function defaultName(text) {
    var first = (text.split("\n").find(function (l) { return l.trim(); }) || "").trim();
    var slug = first.toLowerCase()
      .replace(/[`*_#>\[\]()]/g, "")     // strip common markdown punctuation
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "")
      .slice(0, 48);
    return (slug || "scratch-" + stamp()) + ".md";
  }

  function doSave(id) {
    var text = panes[id].ta.value;
    var name = window.prompt("Save pane " + id + " as (.md or .txt):", defaultName(text));
    if (name === null) return;                       // cancelled
    name = name.trim();
    if (!name) return;
    if (!/\.(md|markdown|txt)$/i.test(name)) name += ".md";

    var type = /\.txt$/i.test(name) ? "text/plain" : "text/markdown";
    var blob = new Blob([text], { type: type + ";charset=utf-8" });
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    flash("downloaded " + name, true);
  }

  function doLoad(id) {
    filePicker.value = "";           // let the same file be picked twice in a row
    filePicker.dataset.target = id;
    filePicker.click();
  }

  filePicker.addEventListener("change", function () {
    var file = filePicker.files && filePicker.files[0];
    if (!file) return;
    var id = filePicker.dataset.target || focused;
    var reader = new FileReader();
    reader.onload = function () {
      var incoming = String(reader.result);
      var ta = panes[id].ta;
      if (ta.value.trim()) {
        // Pane already has content: OK = append, Cancel = replace.
        var append = window.confirm(
          "Pane " + id + " already has content.\n\n" +
          "OK  →  append " + file.name + " to the end\n" +
          "Cancel  →  replace the pane with " + file.name
        );
        edit(id, 0, ta.value.length,
             append ? (ta.value.replace(/\s*$/, "") + "\n\n" + incoming) : incoming);
      } else {
        edit(id, 0, 0, incoming);
      }
      flash("loaded " + file.name, true);
    };
    reader.onerror = function () { flash("could not read " + file.name, true); };
    reader.readAsText(file);
  });

  /* Push contents between panes. */
  function push(from, to) {
    edit(to, 0, panes[to].ta.value.length, panes[from].ta.value);
    flash("pane " + from + " → pane " + to, true);
  }
  var pushR = document.getElementById("pushRight");
  var pushL = document.getElementById("pushLeft");
  pushR.addEventListener("click", function () { push("A", "B"); });
  pushL.addEventListener("click",  function () { push("B", "A"); });

  /* Toolbar button dispatch. */
  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button[data-act]") : null;
    if (!b) return;
    var id = b.dataset.pane, act = b.dataset.act;
    if (act === "copy")  doCopy(id);
    if (act === "clear") doClear(id);
    if (act === "menu")  toggleMenu(id, b);
    if (act === "prev")  applyPreview(id, !previewOn[id]);
    if (act === "save")  doSave(id);
    if (act === "load")  doLoad(id);
  });

  /* ==========================================================================
     Textarea wiring
     ========================================================================== */
  ["A", "B"].forEach(function (id) {
    var ta = panes[id].ta;
    ta.addEventListener("input", function () { changed(id); });
    ta.addEventListener("focus", function () {
      focused = id;
      panes.A.el.classList.toggle("focused", id === "A");
      panes.B.el.classList.toggle("focused", id === "B");
    });
    // Tab inserts a tab character instead of moving focus.
    ta.addEventListener("keydown", function (e) {
      if (e.key === "Tab" && !e.ctrlKey && !e.metaKey && !e.altKey) {
        e.preventDefault();
        edit(id, ta.selectionStart, ta.selectionEnd, "\t", true);
      }
    });
  });

  /* ==========================================================================
     Keyboard shortcuts (on the focused pane where it applies)
     ========================================================================== */
  document.addEventListener("keydown", function (e) {
    if (!(e.metaKey || e.ctrlKey) || e.altKey) return;
    var k = e.key.toLowerCase();
    if (k === "s")      { e.preventDefault(); doSave(focused); }
    else if (k === "o") { e.preventDefault(); doLoad(focused); }
    else if (k === "l") { e.preventDefault(); if (!soloOn) { applyLock(!lockOn); flash(lockOn ? "scroll lock on" : "scroll lock off", true); } }
    else if (k === "d") { e.preventDefault(); if (!soloOn) applyDiff(!diffOn); }
    else if (k === "1") { e.preventDefault(); applySolo(true, focused); }
    else if (k === "2") { e.preventDefault(); applySolo(false); }
    else if (k === "p") { e.preventDefault(); applyPreview(focused, !previewOn[focused]); }
  });

  /* Escape leaves the focused pane's preview, whatever has focus. */
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    ["A", "B"].forEach(function (id) { if (previewOn[id]) applyPreview(id, false); });
  });

  /* ==========================================================================
     Cat companion

     A small SVG silhouette that visits during quiet moments — strolls across
     the bottom edge, peeks up, or curls up asleep. Inline SVG only, no assets
     and no network, so the privacy story is unchanged. The layer ignores the
     pointer; only the cat is clickable, and it flees the instant anyone types,
     so it can never sit on top of live text.
     ========================================================================== */
  (function initCat() {
    var FREQ_KEY = PREFIX + "catFreq";
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    /* Friendliness → how long to wait (ms) between visits, chosen at random
       within each band; "off" means no unprompted visits. Idle-gated on top,
       so she only ever appears during a quiet moment. */
    var BANDS = {
      off:      null,
      shy:      [600000, 1080000],   // ~10–18 min
      curious:  [240000, 420000],    // ~4–7 min
      friendly: [90000, 180000]      // ~1.5–3 min
    };
    var level = get(FREQ_KEY, "curious");
    if (!(level in BANDS)) level = "curious";

    var layer = document.createElement("div");
    layer.id = "catLayer";
    document.body.appendChild(layer);

    /* Two silhouettes, one per theme, with their own fills (white for dark
       mode, black for light). Both are placed in every cat; the CSS shows only
       the one matching data-theme and swaps live if the theme is toggled.
       Shared viewBox 179.78 × 127.1 — ears at the top, so the ears crest the
       edge first as it rises. */
    var CAT_SVG =
      '<svg class="catDark" viewBox="0 0 179.78 127.1" aria-hidden="true"><path fill="#fff" d="M102.24,105.34l-8.54,11.81-8.92-11.86c7.19-.77,10.56-.72,17.46.05ZM56.08,61.66c-12.25,0-22.21,9.95-22.21,22.17s9.96,22.17,22.21,22.17,22.22-9.95,22.22-22.17-9.97-22.17-22.22-22.17ZM65.57,91.9c-4.28,0-7.75-3.46-7.75-7.73s3.47-7.73,7.75-7.73,7.75,3.46,7.75,7.73-3.47,7.73-7.75,7.73ZM170.38,65.43l.37-2.11c6.29-36.08,8.52-59.18.22-62.86-.69-.3-1.48-.46-2.36-.46-8.18,0-26.39,14.16-42.82,27.42l-.56.45c-11.18-4.22-23.06-6.36-35.35-6.36s-24.16,2.14-35.34,6.36C36.42,13.39,18.6,0,10.9,0c-.83,0-1.58.15-2.23.43C3.14,2.87,3.16,11.59,3.18,20.01c0,1.65,0,3.28-.03,4.84v.15s.01.15.01.15c1.63,13.38,3.56,26.28,6.07,40.56C3.11,76.63,0,88.4,0,100.7c0,7.41,1.16,14.75,3.45,21.82.33,1.01.71,2.06,1.18,3.3l.49,1.28h2.11c-.67-1.5-1.28-3.28-1.82-5.04-.02-.06-.04-.11-.06-.17-.33-1.02-.63-2.05-.91-3.09-.03-.1-.06-.21-.09-.3h0c-1.53-5.72-2.36-11.68-2.36-17.81,0-12.45,3.36-24.22,9.33-34.63-2.48-14.04-4.48-27.2-6.18-41.16.22-8.94-.94-20.32,4.33-22.64C15.94-.59,42.47,20.79,54.2,30.16c10.91-4.27,22.98-6.64,35.69-6.64s24.8,2.37,35.71,6.64c11.79-9.51,37.8-30.87,44.56-27.87,8.97,3.98,1.33,45.01-1.87,63.51,6.07,10.48,9.49,22.34,9.49,34.9,0,7.27-1.14,14.3-3.28,20.96-.31.96-.64,1.9-1,2.84-.29.99-.61,1.85-.94,2.6h2.09l.49-1.29c.5-1.31.91-2.47,1.25-3.55,2.24-6.97,3.38-14.23,3.38-21.57,0-12.4-3.16-24.27-9.4-35.27ZM123.77,69.84c-8.31,0-15.07,6.75-15.07,15.04s6.76,15.05,15.07,15.05,15.08-6.75,15.08-15.05-6.76-15.04-15.08-15.04ZM116.97,90.47c-3.01,0-5.46-2.44-5.46-5.45s2.44-5.45,5.46-5.45,5.46,2.44,5.46,5.45-2.44,5.45-5.46,5.45Z"/><circle class="lid" cx="56.08" cy="83.83" r="23.5" fill="#fff"/><circle class="lid" cx="123.77" cy="84.88" r="16.5" fill="#fff"/></svg>' +
      '<svg class="catLight" viewBox="0 0 179.78 127.1" aria-hidden="true"><path fill="#000" d="M111.51,85.02c0-3.01,2.44-5.45,5.46-5.45s5.46,2.44,5.46,5.45-2.44,5.45-5.46,5.45-5.46-2.44-5.46-5.45ZM2,100.7c0-12.45,3.36-24.22,9.33-34.63-2.48-14.04-4.48-27.2-6.18-41.16.22-8.94-.94-20.32,4.33-22.64C15.94-.59,42.47,20.79,54.2,30.16c10.91-4.27,22.98-6.64,35.69-6.64s24.8,2.37,35.71,6.64c11.79-9.51,37.8-30.87,44.56-27.87,8.97,3.98,1.33,45.01-1.87,63.51,6.07,10.48,9.49,22.34,9.49,34.9,0,7.27-1.14,14.3-3.28,20.96-.37,1.16-.79,2.31-1.22,3.45H6.5c-.41-1.06-.79-2.13-1.15-3.21-2.18-6.73-3.35-13.85-3.35-21.2ZM106.7,84.88c0,9.42,7.64,17.05,17.07,17.05s17.08-7.63,17.08-17.05-7.65-17.04-17.08-17.04-17.07,7.63-17.07,17.04ZM84.78,105.29l8.92,11.86,8.54-11.81c-6.9-.77-10.27-.82-17.46-.05ZM31.87,83.83c0,13.35,10.84,24.17,24.21,24.17s24.22-10.82,24.22-24.17-10.84-24.17-24.22-24.17-24.21,10.82-24.21,24.17ZM65.57,91.9c4.28,0,7.75-3.46,7.75-7.73s-3.47-7.73-7.75-7.73-7.75,3.46-7.75,7.73,3.47,7.73,7.75,7.73Z"/><circle class="lid" cx="56.08" cy="83.83" r="23.5" fill="#000"/><circle class="lid" cx="123.77" cy="84.88" r="16.5" fill="#000"/></svg>';

    var active = null;
    var lastActivity = Date.now();
    var nextAt = Date.now() + rnd(18000, 40000);   // first visit fairly soon

    function rnd(a, b) { return a + Math.random() * (b - a); }

    /* One visit: parked below the edge, pop the head up flush with the screen
       bottom, hold, then duck back down (all in the catPop keyframes). Lands
       at a random spot along the width each time. */
    function spawn() {
      if (active) { active.remove(); active = null; }
      var cat = document.createElement("div");
      cat.className = "cat pop";
      cat.innerHTML = CAT_SVG;
      cat.style.left = rnd(4, 82) + "%";              // random horizontal spot
      var dur = rnd(2800, 4000);                      // pop → hold → duck, total
      cat.style.setProperty("--dur", Math.round(dur) + "ms");
      cat.addEventListener("click", react);
      layer.appendChild(cat);
      active = cat;

      /* Blink now and then while she's up — a slow, sleepy eyelid hold of
         ~260ms (not a flicker). Self-clears once the cat is gone from the DOM. */
      var blink = setInterval(function () {
        if (!cat.isConnected) { clearInterval(blink); return; }
        cat.classList.add("blink");
        setTimeout(function () { cat.classList.remove("blink"); }, 260);
      }, rnd(1600, 3200));

      setTimeout(function () { if (active === cat) { cat.remove(); active = null; } }, dur + 150);
    }

    function flee() {
      if (!active) return;
      var c = active; active = null;
      c.classList.add("flee");
      setTimeout(function () { c.remove(); }, 360);
    }

    /* A silent little reaction floating up from the click point. */
    var REACTIONS = ["♥", "~meow", "mrrp", "purr", "♥"];
    function react(e) {
      var msg = REACTIONS[Math.floor(Math.random() * REACTIONS.length)];
      var h = document.createElement("div");
      h.className = "catHeart";
      h.textContent = msg;
      var r = layer.getBoundingClientRect();
      h.style.left = (e.clientX - r.left) + "px";
      h.style.bottom = (r.bottom - e.clientY) + "px";
      layer.appendChild(h);
      setTimeout(function () { h.remove(); }, 1000);
    }

    /* Idle-aware scheduler: only visits after a quiet spell, a few times an
       hour, and never while the tab is hidden. */
    function bandNext(now) { var b = BANDS[level]; return now + rnd(b[0], b[1]); }
    function tick() {
      if (reduce || active || document.hidden || !BANDS[level]) return;  // off / busy
      var now = Date.now();
      if (now - lastActivity < 12000) return;   // wait for a quiet moment
      if (now >= nextAt) { spawn(); nextAt = bandNext(now); }
    }
    setInterval(tick, 4000);

    /* Any real interaction resets the idle clock and shoos the cat away.
       Clicking the cat itself is exempt, so its reaction can play. */
    function busy(e) {
      if (e && e.target && e.target.closest && e.target.closest(".cat")) return;
      lastActivity = Date.now();
      flee();
    }
    document.addEventListener("keydown", busy, true);
    document.addEventListener("pointerdown", busy, true);

    /* Icon button + small popover — peek now, or set how often she visits.
       Same visual language as the Text ▾ menu (menuIn keyframe, pane-bg
       card), kept self-contained so the cat stays one drop-in block. */
    var catBtn = document.getElementById("catBtn");
    var catMenu = document.getElementById("catMenu");
    var catMenuOpen = false;

    function paintFreq() {
      Array.prototype.forEach.call(catMenu.querySelectorAll("[data-freq]"), function (b) {
        b.classList.toggle("on", b.dataset.freq === level);
      });
    }
    paintFreq();

    function openCatMenu() {
      catMenuOpen = true;
      catMenu.hidden = false;
      catBtn.setAttribute("aria-expanded", "true");
      var r = catBtn.getBoundingClientRect();
      catMenu.style.right = Math.max(6, window.innerWidth - r.right) + "px";
      catMenu.style.top = (r.bottom + 5) + "px";
    }
    function closeCatMenu() {
      if (!catMenuOpen) return;
      catMenuOpen = false;
      catMenu.hidden = true;
      catBtn.setAttribute("aria-expanded", "false");
    }
    catBtn.addEventListener("click", function () {
      if (catMenuOpen) { closeCatMenu(); return; }
      openCatMenu();
    });

    document.getElementById("catPeek").addEventListener("click", function () {
      closeCatMenu();
      if (reduce) { flash("cat is off while reduced-motion is on", true); return; }
      lastActivity = 0;   // don't let the idle guard shoo her straight back off
      spawn();
    });

    Array.prototype.forEach.call(catMenu.querySelectorAll("[data-freq]"), function (b) {
      b.addEventListener("click", function () {
        level = b.dataset.freq;
        set(FREQ_KEY, level);
        paintFreq();
        if (!BANDS[level]) { flee(); flash("cat: off", true); }
        else { nextAt = Date.now() + rnd(6000, 12000); flash("cat: " + level, true); }
        closeCatMenu();
      });
    });

    // Clicking anywhere else, or Escape, closes it — same pattern as the
    // Text ▾ menu's own outside-click handling.
    document.addEventListener("mousedown", function (e) {
      if (!catMenuOpen) return;
      if (catMenu.contains(e.target) || (e.target.closest && e.target.closest("#catBtn"))) return;
      closeCatMenu();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closeCatMenu();
    });
    window.addEventListener("resize", closeCatMenu);

    /* Hidden summon, handy for a demo: run slateCat() in the console. */
    window.slateCat = function () { if (!reduce) spawn(); };
  })();

  /* ==========================================================================
     Boot: restore persisted state
     ========================================================================== */
  applyTheme(get(K.theme, "dark") === "light" ? "light" : "dark");
  applySize(parseInt(get(K.size, "16"), 10) || 16);
  applyMono(get(K.mono, "0") === "1");
  applySplit(parseFloat(get(K.split, "50")) || 50);

  panes.A.ta.value = get(K.textA, "");
  panes.B.ta.value = get(K.textB, "");
  updateCounts("A");
  updateCounts("B");

  applyLock(get(K.lock, "0") === "1");
  applyNorm(get(K.norm, "0") === "1");
  applyDiff(get(K.diff, "0") === "1");
  applyWide(get(K.wide, "0") === "1");

  applyPreview("A", get(K.prevA, "0") === "1");   // restore preview state last-ish:
  applyPreview("B", get(K.prevB, "0") === "1");   // the panes' text is already in place

  var bootPane = get(K.soloPane, "A") === "B" ? "B" : "A";
  applySolo(get(K.solo, "0") === "1", bootPane);

  focused = soloOn ? soloPane : "A";
  panes[focused].ta.focus();
  panes[focused].el.classList.add("focused");
})();
</script>
